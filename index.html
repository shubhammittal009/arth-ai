<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Arth AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Tiro+Devanagari+Hindi&display=swap">
<style>:root{--bg:#F2F4F8;--surface:#FFFFFF;--surface2:#F7F8FB;--text:#0A1526;--muted:#5A6577;--faint:#8590A3;--line:#DCE2EC;--line2:#C3CEDF;--grid:#E9EDF4;
--c1:#1E355C;--c2:#6E86AE;--c3:#A9B4C6;--pri:#13233D;--pritext:#FFFFFF;--gold:#C9A227;--goldtext:#7E6107;--goldbg:#FBF3D7;
--good:#2B7655;--goodbg:#E5F2EA;--bad:#B4232C;--badbg:#FBE8EA;--warn:#9A6200;--warnbg:#FDF0D7;--band:rgba(30,53,92,.13);
--side:#0A1526;--sidetext:#D3DBE8;--sidemuted:#7F8CA3;--sideact:#182B4C;
--serif:"Source Serif 4",Cambria,Georgia,"Times New Roman",serif;--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;--dev:"Tiro Devanagari Hindi","Noto Serif Devanagari","Nirmala UI",serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1526;--surface:#0F1C31;--surface2:#13233D;--text:#E8ECF3;--muted:#A9B4C6;--faint:#7F8CA3;--line:#1D3355;--line2:#2B4670;--grid:#172A47;
--c1:#9FB8DE;--c2:#5F7BA8;--c3:#3E5579;--pri:#E8ECF3;--pritext:#0A1526;--gold:#D9B53F;--goldtext:#E9CB69;--goldbg:#2A230F;--good:#62C99A;--goodbg:#0F2D27;--bad:#F27A7D;--badbg:#38171F;--warn:#EFB64F;--warnbg:#32260E;--band:rgba(159,184,222,.17);--side:#060D19;--sideact:#13233D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1526;--surface:#0F1C31;--surface2:#13233D;--text:#E8ECF3;--muted:#A9B4C6;--faint:#7F8CA3;--line:#1D3355;--line2:#2B4670;--grid:#172A47;
--c1:#9FB8DE;--c2:#5F7BA8;--c3:#3E5579;--pri:#E8ECF3;--pritext:#0A1526;--gold:#D9B53F;--goldtext:#E9CB69;--goldbg:#2A230F;--good:#62C99A;--goodbg:#0F2D27;--bad:#F27A7D;--badbg:#38171F;--warn:#EFB64F;--warnbg:#32260E;--band:rgba(159,184,222,.17);--side:#060D19;--sideact:#13233D;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.005em;margin:0}
h1{font-size:30px;line-height:1.15}h2{font-size:19px;line-height:1.3}h3{font-size:16px}
p{margin:.35em 0}a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.num,.n,.kv,td{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}.dev{font-family:var(--dev)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* shell */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;background:var(--side);color:var(--sidetext);padding:18px 14px 24px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:baseline;gap:8px;font:600 24px/1 var(--serif);color:#F3F5F9;padding:2px 8px}
.brand .dev{font-size:21px;color:var(--gold);font-weight:400}
.cobtn{display:block;width:100%;text-align:left;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:10px 12px;color:var(--sidetext);cursor:pointer}
.cobtn b{display:block;font-weight:600;color:#F3F5F9;font-size:14px;line-height:1.3}.cobtn span{font-size:12px;color:var(--sidemuted)}
.cobtn[disabled]{cursor:default}
.navg{display:flex;flex-direction:column;gap:2px}
.navg h4{margin:10px 8px 4px;font:500 12px var(--sans);color:var(--sidemuted)}
.navi{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--sidetext);text-decoration:none;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-size:14px}
.navi:hover{background:rgba(255,255,255,.05)}.navi[aria-current="page"]{background:var(--sideact);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.navi .cnt{margin-left:auto;font-size:11.5px;background:rgba(201,162,39,.18);color:#E6C866;border-radius:999px;padding:0 7px}
.side .foot{margin-top:auto;font-size:12px;color:var(--sidemuted);padding:0 8px;line-height:1.45}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px 28px;border-bottom:1px solid var(--line)}
.top h1{font-size:20px}
.top .ask{flex:1;max-width:520px;margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:0 6px 0 12px}
.top .ask input{flex:1;border:0;background:transparent;padding:9px 0;outline:none;min-width:0}
.iconbtn{position:relative;display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--text)}
.iconbtn .dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px}
.who{display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer}
.who i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--c1);color:var(--surface);font:600 12px var(--sans);font-style:normal}
.who span{font-size:13px;line-height:1.2}.who small{display:block;color:var(--muted);font-size:11.5px}
.menubtn{display:none}
main#view{padding:24px 28px 64px;max-width:1280px;width:100%;outline:none}
.scrim{display:none}
/* page blocks */
.page{display:flex;flex-direction:column;gap:20px}
.hgroup{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.hgroup p{color:var(--muted);margin:4px 0 0;max-width:72ch}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
.grid2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.panel.flat{background:transparent;border:0;border-top:1px solid var(--line2);border-radius:0;padding:16px 0 0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.ph .sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.kband{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kband .k{padding:14px 18px;border-left:1px solid var(--line);min-width:0}.kband .k:first-child{border-left:0}
.kl{font-size:12.5px;color:var(--muted)}
.kv{font:600 25px/1.2 var(--serif);margin-top:2px;white-space:nowrap}
.ks{font-size:12.5px;color:var(--muted);margin-top:2px}
.kv.bad,.bad-t{color:var(--bad)}.kv.good,.good-t{color:var(--good)}.kv.warn,.warn-t{color:var(--warn)}
/* brief */
.greet h1{font-size:32px}.greet p{color:var(--muted);margin-top:6px}
.note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:4px 14px 14px 4px;padding:22px 26px}
.note h2{font-size:23px;margin-bottom:6px}
.three{list-style:none;margin:0;padding:0;counter-reset:i}
.three li{counter-increment:i;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 14px;align-items:start;padding:16px 0;border-top:1px solid var(--grid)}
.three li:first-child{border-top:0}
.three li::before{content:counter(i);font:600 30px/1 var(--serif);color:var(--goldtext);grid-row:span 2}
.three .t{font:600 18px/1.35 var(--serif)}.three p{color:var(--muted);margin:2px 0 0;grid-column:2;max-width:70ch}
.three .btn{grid-column:3;grid-row:1/span 2;align-self:center}
/* buttons, chips */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--c2)}.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--pri);color:var(--pritext);border-color:transparent}
.btn.ai{background:var(--goldbg);border-color:var(--gold);color:var(--goldtext)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}.btn.lg{padding:12px 20px;font-size:15.5px;border-radius:11px}
.btn.ghost{border-color:transparent;background:transparent}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.chip.critical{background:var(--badbg);color:var(--bad);border-color:transparent;font-weight:600}.chip.high{background:var(--badbg);color:var(--bad);border-color:transparent}
.chip.medium{background:var(--warnbg);color:var(--warn);border-color:transparent}.chip.low{background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--goodbg);color:var(--good);border-color:transparent}.chip.gold{background:var(--goldbg);color:var(--goldtext);border-color:var(--gold)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--pritext)}
/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .n{text-align:right;white-space:nowrap}.tbl th.n{text-align:right}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--surface2)}
.tbl .empty{color:var(--muted);text-align:center;padding:24px}
.bar{height:6px;border-radius:3px;background:var(--grid);overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--c1)}
.chart{width:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
/* forms */
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:8px 10px;color:var(--text);font-size:14px;min-width:0}
.field textarea{min-height:180px;line-height:1.5;resize:vertical}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end}
/* chat */
.chatwrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:start}
.thread{display:flex;flex-direction:column;gap:22px;min-height:200px}
.msg.user{align-self:flex-end;background:var(--pri);color:var(--pritext);border-radius:14px 14px 4px 14px;padding:10px 14px;max-width:min(78%,640px)}
.msg.arth{max-width:860px}
.msg.arth .who2{display:flex;align-items:center;gap:8px;font:600 14px var(--serif);margin-bottom:4px}
.msg.arth .who2 .dev{color:var(--goldtext);font-weight:400}
.msg.arth .body{font-size:15px}.msg.arth .body ul,.msg.arth .body ol{margin:.4em 0;padding-left:1.25em}.msg.arth .body li{margin:.2em 0}
.msg.arth .body p{white-space:pre-wrap}
.vbadge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--gold);color:var(--goldtext);background:var(--goldbg);border-radius:999px;padding:2px 10px}
.vbadge.warn{border-color:var(--warn);color:var(--warn);background:var(--warnbg)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
details.trace{margin-top:8px;font-size:13px;color:var(--muted)}details.trace summary{cursor:pointer}
details.trace ol{margin:6px 0 0;padding-left:1.2em}
.composer{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:8px;margin-top:18px;box-shadow:0 6px 24px rgba(10,21,38,.08)}
.composer textarea{flex:1;border:0;background:transparent;resize:none;outline:none;padding:8px;min-height:44px;max-height:160px}
.sugg{display:flex;flex-direction:column;gap:8px}
.sugg button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;cursor:pointer;font-size:13.5px;color:var(--text)}
.sugg button:hover{border-color:var(--gold)}
.thinking{display:inline-flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
/* misc */
.empty-state{border:1px dashed var(--line2);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.drop{border:2px dashed var(--line2);border-radius:14px;padding:26px;text-align:center;background:var(--surface);cursor:pointer}
.drop.over{border-color:var(--gold);background:var(--goldbg)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start}
.steps li>b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:12px;background:var(--grid);color:var(--muted)}
.steps li.done>b{background:var(--good);color:#fff}.steps li.warn>b{background:var(--warn);color:#fff}.steps li.fail>b{background:var(--bad);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.card h3{font-family:var(--serif)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line2);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:14px}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--gold);font-weight:500}
.kv-list{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}.kv-list dt{color:var(--muted)}.kv-list dd{margin:0}
.err{border:1px solid var(--bad);background:var(--badbg);color:var(--bad);border-radius:12px;padding:18px}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--grid),var(--surface2),var(--grid));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.progress{height:6px;border-radius:3px;background:var(--grid);overflow:hidden}.progress i{display:block;height:100%;background:var(--gold);transition:width .2s}
/* modal, toasts, menus */
.modal-bg{position:fixed;inset:0;background:rgba(6,13,25,.55);z-index:60;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.modal{background:var(--surface);border-radius:16px;width:min(760px,100%);max-height:100%;overflow:auto;padding:22px 24px;border:1px solid var(--line)}
.modal.wide{width:min(1000px,100%)}
.modal .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--pri);color:var(--pritext);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 8px 28px rgba(0,0,0,.18);max-width:min(560px,92vw)}
.pop{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 36px rgba(10,21,38,.16);padding:8px;z-index:50;min-width:280px}
.pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--text)}
.pop button:hover{background:var(--surface2)}.pop small{color:var(--muted);display:block}
.rel{position:relative}
/* landing */
.landing{--ink:#0B1B33;--ink2:#10264A;--inkline:#1F3A63;--paper:#F3F5F9;--saffron:#D9A42B;--slate:#5A6577;background:var(--paper);color:var(--ink);min-height:100vh;font-size:16px;color-scheme:light}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.landing .wrap{max-width:1200px;margin:0 auto;padding:0 32px}
.lp-top{position:relative;color:#E8ECF3;background:radial-gradient(760px 420px at 88% 22%,rgba(217,164,43,.22),transparent 65%),radial-gradient(720px 480px at -5% 110%,rgba(56,160,170,.20),transparent 60%),linear-gradient(158deg,#071226 0%,#0C2049 52%,#173A7A 100%);overflow:hidden}
.lp-top::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse 80% 70% at 70% 40%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse 80% 70% at 70% 40%,#000 20%,transparent 75%);pointer-events:none}
.lp-top>.wrap{position:relative}
.lhead{display:flex;align-items:center;gap:32px;padding:22px 0}
.lhead .brand{padding:0;margin-right:auto}
.lnav{display:flex;gap:28px}
.lnav a{color:#B9C4D6;text-decoration:none;font-size:14.5px}
.lnav a:hover{color:#fff}
.lb{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:10px 18px;font:500 15px var(--sans);cursor:pointer;border:1px solid transparent;text-decoration:none;white-space:nowrap}
.lb.sm{padding:8px 14px;font-size:14px}.lb.lg{padding:13px 22px;font-size:16px;border-radius:11px}
.lb.pri{background:var(--saffron);color:var(--ink)}.lb.pri:hover{background:#E4B443}
.lb.dk{background:transparent;color:#E8ECF3;border-color:#2E4D7A}.lb.dk:hover{border-color:#6E86AE}
.lb.out{background:#fff;color:var(--ink);border-color:#C3CEDF}.lb.out:hover{border-color:var(--ink)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:56px;align-items:center;padding:36px 0 84px}
.hero h1{font-size:clamp(34px,4.3vw,56px);line-height:1.05;letter-spacing:-.02em;color:#F6F7FA;max-width:16ch}

    let city = R.pick(CITIES), name, tries = 0;
    do {

    const big = ['retail'].includes(S.kind) ? 0.25 : 1;

  const R = RNG(co.seed * 7919 + 13);
  const S = SECTORS[co.sector];
  const F = !!co.featured;
  const start = mStart(mk(A) - 38);
  const season = SEASON[S.season];
  const D = { co, A, start, sector: S, branches: [], customers: [], suppliers: [], products: [], employees: [], invoices: [], payments: [], notes: [], bills: [], expenses: [], bank: [], loans: [], vendorChanges: [], fds: [], plants: {} };
  const crunch = mStart(mk(A) - 23) + 14; // historical crunch (visible month ~14)
  D.plants.crunch = F ? crunch : null;

  /* branches */
  if (F) {
    D.branches.push({ id: 'B1', name: 'Chakan plant', city: 'Pune', state: 'MH', code: 'C', zone: 'West', gstin: mkGSTIN('MH', co.pan, 1) });
    D.branches.push({ id: 'B2', name: 'Hosur plant', city: 'Hosur', state: 'TN', code: 'H', zone: 'South', gstin: mkGSTIN('TN', co.pan, 1) });

    const nb = co.turnover > 40e7 ? 3 : co.turnover > 12e7 && S.kind !== 'retail' ? 2 : 1;
    const other = CITIES.filter(c => STATES[c[1]].z !== STATES[co.state].z);

  for (let i = 0; i < recent.length; i++) for (let j = i + 1; j < recent.length; j++) { const a = recent[i], b = recent[j]; if (b.date - a.date > (P.dupDays || 7)) break; if (vkey(a) === vkey(b) && Math.abs(a.amount - b.amount) < 1 && a.amount > 2e4 && (norm(a.ref) === norm(b.ref) || !a.ref)) out.dup.push([a, b]); }

}

/* ---------- rule engine ---------- */
const RULES = [
  { id: 'overdue', name: 'Customer overdue beyond threshold', p: { days: 60 }, unit: 'days' },
  { id: 'buffer', name: 'Projected cash below safety buffer', p: { buffer: 0 }, unit: '₹ (0 = auto)' },
  { id: 'payroll', name: 'Cash below next payroll in the next 4 weeks', p: {} },
  { id: 'stock', name: 'Stock idle beyond threshold', p: { days: 90 }, unit: 'days' },
  { id: 'margin', name: 'Gross margin drop, quarter on quarter', p: { pct: 10 }, unit: '% fall' },
  { id: 'conc', name: 'Customer concentration', p: { share: 25 }, unit: '% of revenue' },
  { id: 'climit', name: 'Credit limit breached', p: {} },
  { id: 'dup', name: 'Possible duplicate bill', p: { days: 7 }, unit: 'days apart' },
  { id: 'split', name: 'Payments split under approval limit', p: { limit: 50000 }, unit: '₹ limit' },
  { id: 'off', name: 'Off-hours or Sunday payment', p: { amount: 50000 }, unit: '₹ minimum' },
  { id: 'vbank', name: 'Payment soon after vendor bank change', p: { days: 7 }, unit: 'days' },
  { id: 'spike', name: 'Expense category spike', p: { z: 3.5 }, unit: 'robust z' },
  { id: 'itc', name: 'ITC missing from GSTR-2B', p: { amount: 10000 }, unit: '₹ minimum' },
  { id: 'irn', name: 'E-invoice IRN missing', p: {} },
  { id: 'dso', name: 'DSO rising vs 90 days ago', p: { days: 10 }, unit: 'days' },
  { id: 'msmed', name: 'Buyer past 45-day MSMED limit', p: {} }

function ruleParams(M, id) { const r = RULES.find(x => x.id === id); return Object.assign({}, r.p, (M.D.settings.rules || {})[id] || {}); }
function runRules(M) {
  const D = M.D, A = M.A, al = [], add = (rule, sev, title, detail, amt, act, ev) => al.push({ id: rule + '-' + al.length, rule, sev, title, detail, amt: amt || 0, act, ev });

  const on = id => !off.has(id);
  if (on('overdue')) { const p = ruleParams(M, 'overdue'); M.chase.filter(x => x.a.maxOd > p.days).slice(0, 8).forEach(x => add('overdue', x.a.overdue > 10e5 ? 'high' : 'medium', `${x.c.name} is ${x.a.maxOd} days overdue`, `${inr(x.a.overdue)} overdue across ${x.a.invs.filter(i => i.od > 0).length} invoices · ${x.label}`, x.a.overdue, { do: 'nudge', id: x.c.id })); }
  const fc = M.fc;
  if (on('buffer') && fc.min.p50 < fc.buffer) add('buffer', fc.min.p50 < 0 ? 'critical' : 'high', `Cash falls to ${inr(fc.min.p50)} in week ${fc.min.i}`, `Below the ${inr(fc.buffer)} safety buffer (${wkRange(fc.min.s, fc.min.e)}); ${inr(fc.need)} must be collected to stay above it`, fc.need, { do: 'go', v: 'cash' });
  if (on('payroll')) { const pay = fc.rec.find(r => r.cat === 'Salaries & wages'); const w4 = fc.weeks.slice(0, 4); if (pay && w4.some(w => w.p50 < pay.monthly)) { const w = w4.find(x => x.p50 < pay.monthly); add('payroll', 'high', `Cash may not cover payroll in week ${w.i}`, `Projected balance ${inr(w.p50)} vs monthly payroll ${inr(pay.monthly)}`, pay.monthly, { do: 'go', v: 'cash' }); } }
  if (on('stock')) { const p = ruleParams(M, 'stock'); const sl = M.inv.slow.filter(x => x.idle > p.days || x.doi > p.days * 1.4); if (sl.length) add('stock', 'medium', `${sl.length} SKUs idle beyond ${p.days} days`, `${inr(sum(sl, x => x.value))} locked in stock — clear or discount`, sum(sl, x => x.value), { do: 'go', v: 'inventory' }); }
  if (on('margin')) { const p = ruleParams(M, 'margin'); M.zones.filter(z => z.gm0 > 0 && (z.gm0 - z.gm1) / z.gm0 * 100 > p.pct).forEach(z => add('margin', 'high', `${z.k} margin down ${pts(z.gm1 - z.gm0)}`, `Gross margin ${pct(z.gm0)} → ${pct(z.gm1)} (${qLabel(qOf(D.plants.pq[0]))} → ${qLabel(qOf(D.plants.lq[0]))})`, (z.gm0 - z.gm1) * z.rev1, { do: 'rc', zone: z.k })); }
  if (on('conc')) { const p = ruleParams(M, 'conc'); M.custs.filter(x => x.share * 100 > p.share).forEach(x => add('conc', 'medium', `${x.c.name} is ${pct(x.share)} of revenue`, 'High dependence on one customer', 0, { do: 'cust', id: x.c.id })); }
  if (on('climit')) M.custs.filter(x => x.a.total > x.c.climit * 1.05 && x.c.climit > 0).slice(0, 5).forEach(x => add('climit', 'medium', `${x.c.name} above credit limit`, `${inr(x.a.total)} outstanding vs limit ${inr(x.c.climit)}`, x.a.total - x.c.climit, { do: 'cust', id: x.c.id }));
  const an = M.anom;
  if (on('dup')) an.dup.forEach(([a, b]) => add('dup', 'high', `Possible duplicate: ${a.vendor} ${inr(a.amount)}`, `Bills ${a.ref || '—'} (${fmtDs(a.date)}) and ${b.ref || '—'} (${fmtDs(b.date)}) have the same amount`, a.amount, { do: 'anom' }, [a, b]));
  if (on('split')) an.split.forEach(s => add('split', 'high', `${s.rows.length} payments just under ${inr(ruleParams(M, 'split').limit)}`, `${s.v}: ${s.rows.map(r => inr(r.amount, 1)).join(', ')} on consecutive days — total ${inr(s.total)}`, s.total, { do: 'anom' }, s.rows));
  if (on('off')) an.off.forEach(e => add('off', 'medium', `${inr(e.amount)} paid ${wday(e.date) === 0 ? 'on a Sunday' : 'off-hours'} at ${String(Math.floor(e.t / 60)).padStart(2, '0')}:${String(e.t % 60).padStart(2, '0')}`, `${e.vendor} · ${e.mode} · ${fmtD(e.date)}`, e.amount, { do: 'anom' }, [e]));
  if (on('vbank')) an.vbank.forEach(v => add('vbank', 'critical', `${inr(v.amt)} paid to ${v.vc.vendor} days after its bank account changed`, `Account changed ${fmtDs(v.vc.date)} (${v.vc.from} → ${v.vc.to}) by ${v.vc.by}; verify by phone before the next payment`, v.amt, { do: 'anom' }, v.pays));
  if (on('spike')) an.spike.forEach(s => add('spike', 'medium', `${s.cat} spiked to ${inr(s.last)} in ${s.month}`, `Typical month ${inr(s.med)} (robust z ${s.z.toFixed(1)})`, s.last - s.med, { do: 'anom' }));

  if (on('itc') && g.itcRisk > ruleParams(M, 'itc').amount) g.bySup.slice(0, 3).forEach(x => add('itc', 'high', `${inr(x.amt)} ITC not in GSTR-2B: ${x.sup ? x.sup.name : 'supplier'}`, `${x.n} bills — the supplier hasn’t filed; ITC can’t be claimed until it reflects`, x.amt, { do: 'go', v: 'gst' }));
  if (on('irn')) g.irn.forEach(x => add('irn', x.expired ? 'high' : 'medium', `${x.inv.no}: no IRN ${x.expired ? '— 30-day window lapsed' : `(${30 - x.age} days left)`}`, x.expired ? 'Invoice older than 30 days can’t be reported on the IRP; issue a fresh e-invoice' : 'Generate the e-invoice before the 30-day reporting window closes', x.inv.total, { do: 'go', v: 'gst' }));
  if (on('dso')) { const p = ruleParams(M, 'dso'); const b = M.bridge; if (b.dso1 - b.dso0 > p.days) add('dso', 'medium', `DSO up ${Math.round(b.dso1 - b.dso0)} days in 90 days`, `${Math.round(b.dso0)} → ${Math.round(b.dso1)} days; ${inr(b.stuck)} more cash is stuck with customers`, b.stuck, { do: 'go', v: 'receivables' }); }
  if (on('msmed') && ['Micro', 'Small'].includes(D.category) && !['dist', 'retail'].includes(D.sector.kind)) { const xs = M.chase.filter(x => x.c.gstin && x.oldest && x.oldest.inv.date < A - 45); if (xs.length) add('msmed', 'low', `${xs.length} buyers past the 45-day MSMED limit`, `${inr(sum(xs, x => x.a.overdue))} owed; interest at 3× the RBI bank rate is claimable and Section 43B(h) affects their tax deduction`, sum(xs, x => x.a.overdue), { do: 'go', v: 'receivables' }); }
  const sevW = { critical: 4, high: 3, medium: 2, low: 1 };
  return al.sort((a, b) => sevW[b.sev] - sevW[a.sev] || b.amt - a.amt);
}

/* ---------- the model ---------- */

  get crunch() { return this.m('crunch', () => crunchCheck(this.D, this.A, this.fc.buffer)); }
  get rf() { return this.m('rf', () => revForecast(this.D, this.pnl)); }
  get lg() { return this.m('lg', () => trainLogit(this.D, this.A)); }
  get inv() { return this.m('inv', () => inventoryModel(this.D)); }
  get gst() { return this.m('gst', () => gstStatus(this.D)); }
  get anom() { return this.m('anom', () => anomalyScan(this.D, { limit: ruleParams(this, 'split').limit, dupDays: ruleParams(this, 'dup').days, offAmt: ruleParams(this, 'off').amount, vbDays: ruleParams(this, 'vbank').days, z: ruleParams(this, 'spike').z })); }
  get alerts() { return this.m('alerts', () => runRules(this)); }
  get t12() { return this.m('t12', () => ttm(this.pnl, mk(this.A) - 1)); }
  get t12p() { return this.m('t12p', () => ttm(this.pnl, mk(this.A) - 13)); }
  get custs() { return this.m('custs', () => {
    const D = this.D, A = this.A, ar = this.ar, cm = this.cm, rev = new Map();

      const a = ar.byCust.get(c.id) || { total: 0, overdue: 0, maxOd: 0, n: 0, od60: 0, invs: [] }, m = cm.map.get(c.id), r = rev.get(c.id) || 0;

  }); }
  get chase() { return this.m('chase', () => {
    const cat = this.D.category, eligible = ['Micro', 'Small'].includes(cat) && !['dist', 'retail'].includes(this.D.sector.kind);
    return this.custs.filter(x => x.a.overdue > 0).map(x => {
      const { mu, sig } = x.m; let p14 = 0, p30 = 0, w = 0;
      for (const it of x.a.invs) { if (it.od <= 0) continue; if (it.od > mu + sig) { const mT = Math.max(12, .8 * (it.od - mu)); p14 += (1 - Math.exp(-14 / mT)) * it.o; p30 += (1 - Math.exp(-30 / mT)) * it.o; } else { const F0 = ncdf((it.od - mu) / sig), den = Math.max(1e-6, 1 - F0); p14 += (ncdf((it.od + 14 - mu) / sig) - F0) / den * it.o; p30 += (ncdf((it.od + 30 - mu) / sig) - F0) / den * it.o; } w += it.o; }

  rc(scope) { // scope: {zone}|{sku}|{cust}|{}
    const D = this.D, f = scope.zone ? inv => inv.zone === scope.zone : scope.cust ? inv => inv.cust === scope.cust : scope.branch ? inv => inv.branch === scope.branch : () => true;

  }
  get rcTop() { const tot = sum(this.zones, z => z.rev1), z = this.zones.filter(z => z.rev1 >= tot * .1 && z.gm0 - z.gm1 > .015).sort((a, b) => (b.gm0 - b.gm1) * b.rev1 - (a.gm0 - a.gm1) * a.rev1)[0]; return z && z.gm1 - z.gm0 < -.015 ? this.rc({ zone: z.k }) : this.rc({}); }
  get bridge() { return this.m('bridge', () => {

  }); }
  get bs() { return this.m('bs', () => {
    const D = this.D, A = this.A, cash = balAt(D, A), t = this.t12;
    const ap = sum(D.bills.filter(b => b.date <= A && (b.paid == null || b.paid > A)), b => b.total);
    const loans = D.loans.filter(l => l.start <= A), tl = sum(loans, l => { const s = l.sched.filter(x => x.day <= A).pop(); return s ? s.bal : l.principal; });
    const curMat = sum(loans, l => sum(l.sched.filter(x => x.day > A && x.day <= A + 365), x => x.prin));
    const stat = sum(this.fc.rec.filter(r => ['TDS', 'PF & ESI'].includes(r.cat)), r => r.monthly) + (this.fc.weeks.length ? sum(this.fc.drivers.filter(x => x.cat === 'GST').slice(0, 1), x => x.amt) : 0);

  }); }
  get lm() { return this.m('lm', () => {

  }); }
  get loan() { return this.m('loan', () => {
    const l = this.lm, daily = this.bridge.daily;
    const chk = [
      { k: 'Debt service cover (DSCR)', v: l.dscr, s: x => x.toFixed(2) + '×', ok: l.dscr >= 1.5, warn: l.dscr >= 1.25, need: '≥ 1.50×', w: 15, fix: 'Keep new borrowing for capex on a separate term loan; avoid funding machines from working capital' },
      { k: 'Current ratio', v: l.cr, s: x => x.toFixed(2), ok: l.cr >= 1.33, warn: l.cr >= 1.2, need: '≥ 1.33', w: 12, fix: 'Convert short-term payables into a sanctioned working-capital limit' },

      { k: 'Debtor days', v: l.dso, s: x => Math.round(x) + ' days', ok: l.dso <= 60, warn: l.dso <= 90, need: '≤ 60 days', w: 14, fix: `Collect ${inr(Math.max(0, l.dso - 60) * daily)} of overdue to bring debtor days to 60` },

const AI = { sample: null, maxTools: 16, tier: 'quick', state: 'checking' };
function agentRules(M, persona) {
  return `You are Arth, the AI CFO inside a finance app for ${M.D.co.name} (${M.D.sector.label}, ${M.D.co.city}; 12-month revenue ${inr(M.kpi.rev)}). Today is ${fmtD(M.A)}. You are speaking with ${persona.name}, ${persona.role}.
How to work:
- Use the tools to get facts. Call every tool you need first; write nothing before the tool calls. Then write one final answer.
- Every number you write must appear in a tool result in this conversation — copy it exactly, including ₹ and L/Cr. Never add, subtract, average or estimate figures yourself. If no tool gives a figure, say what you would need.
- Format: one direct sentence that answers the question; then 2–5 short bullet points with key figures and reasons; then a final line starting “Next step:” with one specific action. Under 170 words unless asked for a report, update, email or WhatsApp message.
- Drafts (WhatsApp, email, investor or bank updates) are ready to send: specific invoice numbers, amounts, days and our payment details from the tools. Use Hindi or Hinglish only if asked.
- For law, tax, schemes or regulations use search_knowledge, give general guidance and suggest confirming with the company’s CA.
- Plain text with light Markdown (bold, bullets). No tables or headings.`;
}

  if (!AI.sample || o.offline) return offline();

    try { const res = await AI.sample([{ role: 'user', content: agentRules(M, persona) + '\nThe tools have already been run; their results are in DATA.' }, ...(o.history || []).slice(-6), { role: 'user', content: q + '\n\nDATA: ' + data }], { modelTier: o.tier || AI.tier, cache: false, signal: o.signal, onText: ({ text }) => o.onText && o.onText(text) }); const v = verifyAnswer(res.text, r.calls.map(c => c.r.data)); if (v.bad.length > 1) return { mode: 'engine', text: r.text, calls: r.calls, v: verifyAnswer(r.text, r.calls.map(c => c.r.data)), ms: Date.now() - t0, note: 'Claude’s draft had figures the tools didn’t produce, so the engine’s answer is shown.' }; return { mode: 'claude', tier: res.modelTierApplied, text: res.text.trim(), calls: r.calls, v, ms: Date.now() - t0 }; }

  }
  const calls = [], hist = (o.history || []).slice(-6);
  let cur = '', cut = 0;
  const tools = ARTH_TOOLS.slice(0, AI.maxTools).map(t => ({ name: t.name, description: t.description, inputSchema: t.schema || { type: 'object', properties: {} }, execute: input => { const t1 = Date.now(); const r = t.run(M, input || {}); calls.push({ name: t.name, args: input || {}, r, ms: Date.now() - t1 }); cut = cur.length; o.onTool && o.onTool(t.name, input); return r.data; } }));

async function ask(q) {

  S.chat.push({ id: uid(), role: 'user', text: q }, am); S.busy = new AbortController(); render(); scrollThread();
  try {
    const r = await askArth(S.M, q, { persona: S.persona, history, tier: AI.tier, signal: S.busy.signal, onTool: n => { am.status = TOOLMSG[n] || 'Working…'; if (!am.partial) updMsg(am); }, onText: t => { am.partial = t; updMsg(am); } });
    Object.assign(am, { pending: false, partial: null, text: r.text, mode: r.mode, tier: r.tier, ms: r.ms, v: r.v, note: r.note, reflected: r.reflected, calls: r.calls.map(c => ({ name: c.name, args: c.args })) });

  } catch (e) { Object.assign(am, { pending: false, text: e && e.code === 'cancelled' ? (am.partial || 'Stopped.') : 'That didn’t work: ' + ((e && (e.message || e.code)) || 'unknown error'), mode: 'engine', ms: 0 }); }
  S.busy = null; S.J.chat = S.chat.filter(m => !m.pending); save(); render(); scrollThread();
}
